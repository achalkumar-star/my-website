<style>
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 10% 10%,#61dafb22,transparent 28%),radial-gradient(circle at 90% 90%,#39e58c18,transparent 30%),#07111f;color:#f4f8ff;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{max-width:1450px;margin:auto;padding:18px}.card{background:#0d1b2ef5;border:1px solid #28415f;border-radius:18px;box-shadow:0 14px 45px #0005}.btn{border:1px solid #315172;background:#12243b;color:#fff;padding:10px 14px;border-radius:11px;font-weight:700}.btn:hover{filter:brightness(1.15)}.primary{background:#146b8a;border-color:#2e9ec5}.success{background:#126640;border-color:#24a86f}.danger{background:#742d3a;border-color:#c95869}.warning{background:#70541a;border-color:#c79b37}.muted{color:#91a5bc}.small{font-size:12px}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;background:#12243b;border:1px solid #28415f;font-size:12px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}.wrap{padding:10px}}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login{width:min(500px,100%);padding:30px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}.brand .logo{font-size:42px}.brand h1{font-size:22px}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:12px;color:#91a5bc;font-weight:700}.field input,.field select,.field textarea{width:100%;background:#081727;color:#fff;border:1px solid #28415f;border-radius:10px;padding:11px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#61dafb}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.nav button.active{background:#146b8a;border-color:#61dafb}.stat{padding:18px}.stat b{display:block;font-size:27px;margin-top:7px}.section{padding:18px;margin-bottom:15px}.section h2{font-size:18px;margin-bottom:12px}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:9px;border-bottom:1px solid #203650;text-align:left;font-size:13px}.table th{color:#91a5bc;background:#0b1929;position:sticky;top:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.toast{position:fixed;right:18px;bottom:18px;z-index:99;max-width:380px;background:#10243a;border:1px solid #3d6388;border-radius:13px;padding:13px 15px;box-shadow:0 10px 30px #0008}.notice{padding:12px;border-radius:12px;background:#0b1d2d;border:1px solid #28415f;margin:8px 0}.dangerText{color:#ff6675}.successText{color:#39e58c}.empty{padding:30px;text-align:center;color:#91a5bc}.daygrid{display:grid;grid-template-columns:110px repeat(7,minmax(105px,1fr));gap:1px;background:#28415f;border:1px solid #28415f;overflow:auto}.daygrid>div{background:#0b1929;padding:8px}.daygrid .head{font-weight:800;color:#61dafb}.daygrid input{width:100%;background:#07111f;color:#fff;border:1px solid #28415f;border-radius:7px;padding:7px}.billSheet{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bill{background:#fff;color:#111;border:1px solid #999;padding:10px;min-height:220px}.bill h3{font-size:15px;text-align:center}.bill table{width:100%;border-collapse:collapse;font-size:11px}.bill td{padding:2px;border-bottom:1px solid #ddd}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:15px;z-index:90}.modalBox{width:min(600px,100%);max-height:90vh;overflow:auto;padding:20px}.loading{position:fixed;inset:0;background:#07111ff0;display:flex;align-items:center;justify-content:center;z-index:100;font-size:20px}.printOnly{display:none}
@media print{body{background:#fff;color:#000}.noPrint,#appHeader,#nav,.toast,.modal{display:none!important}.printOnly{display:block}.billSheet{grid-template-columns:1fr 1fr;gap:7px}.bill{break-inside:avoid;min-height:0;height:125mm}.wrap{padding:0}.section{border:0;box-shadow:none}}

<body>
<div id="loading" class="loading">🥛 Loading DHANALAKSHMI MILK DAIRY…</div>
<section id="loginScreen">
  <div class="card login">
    <div class="brand"><div class="logo">🥛</div><div><h1>DHANALAKSHMI MILK DAIRY</h1><div class="muted small">Digital Dairy Management • Cloud Sync</div></div></div>
    <div class="tabs"><button id="ownerTab" class="btn primary" onclick="setLoginMode('owner')">👑 Owner</button><button id="employeeTab" class="btn" onclick="setLoginMode('employee')">👨‍💼 Employee</button></div>
    <div id="loginForm">
      <div class="field"><label>LOGIN ID</label><input id="loginId" autocomplete="username" placeholder="Enter login ID"></div>

      <div id="ownerCodeWrap" class="field"><label>OWNER SECURITY CODE</label><input id="ownerCode" type="password" placeholder="Required for owner access" onkeydown="if(event.key==='Enter')login()"></div>
      <button class="btn primary" style="width:100%" onclick="login()">🔐 LOGIN</button>

    </div>

</section>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
'use strict';
const firebaseConfig={apiKey:"AIzaSyACG45U-PDxFuXyvhxz0olo0x5S957o-7U",authDomain:"dhanalakshmi-milk-dairy.firebaseapp.com",projectId:"dhanalakshmi-milk-dairy",storageBucket:"dhanalakshmi-milk-dairy.firebasestorage.app",messagingSenderId:"548531175682",appId:"1:548531175682:web:39bf5359670e1056ac421b",measurementId:"G-Y12H5PGSGT"};
const DBKEY='DMD_FULL_V3';
const DEFAULT={customers:[],milk:[],credits:[],bills:[],users:[],requests:[],announcements:[],activity:[],settings:{ownerId:'owner',ownerPassword:'11223',ownerCode:'11223'},lastSync:null};
let dbLocal=loadLocal(), firestore=null, cloudReady=false, loginMode='owner', session=null, page='dashboard', saveTimer=null;
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadLocal(){try{return Object.assign(clone(DEFAULT),JSON.parse(localStorage.getItem(DBKEY)||'{}'))}catch(e){return clone(DEFAULT)}}
function saveLocal(){localStorage.setItem(DBKEY,JSON.stringify(dbLocal));}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),3200)}
function modal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function setLoginMode(mode){loginMode=mode;document.getElementById('ownerTab').className='btn '+(mode==='owner'?'primary':'');document.getElementById('employeeTab').className='btn '+(mode==='employee'?'primary':'');document.getElementById('ownerCodeWrap').classList.toggle('hidden',mode!=='owner');document.getElementById('requestBtn').classList.toggle('hidden',mode!=='employee');document.getElementById('loginMsg').textContent=mode==='owner'?'Owner access includes employee management, activity history and settings.':'Use an approved employee Login ID and password. New employees can request access.'}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
async function cloudInit(){try{firebase.initializeApp(firebaseConfig);firestore=firebase.firestore();await firestore.collection('dairy').doc('system').get();cloudReady=true;document.getElementById('cloudLoginStatus').textContent='☁️ Cloud connection ready';setSync('☁️ Cloud connected');await pullCloud()}catch(e){cloudReady=false;document.getElementById('cloudLoginStatus').textContent='⚠️ Cloud unavailable — local mode is active';setSync('⚠️ Local mode')}}
async function pullCloud(){if(!cloudReady)return;try{const snap=await firestore.collection('dairy').doc('system').get();if(snap.exists){const d=snap.data().data;if(d&&typeof d==='object'){dbLocal=Object.assign(clone(DEFAULT),d);saveLocal()}}setSync('☁️ Synced');}catch(e){setSync('⚠️ Cloud read failed');}}
function setSync(s){document.getElementById('syncPill').textContent=s}
async function pushCloud(){saveLocal();if(!cloudReady){setSync('💾 Saved locally');return false}try{setSync('⏳ Saving…');await firestore.collection('dairy').doc('system').set({data:dbLocal,updatedAt:new Date().toISOString()});dbLocal.lastSync=new Date().toISOString();saveLocal();setSync('☁️ Synced');return true}catch(e){setSync('⚠️ Cloud save failed');return false}}
function queueSave(){saveLocal();clearTimeout(saveTimer);saveTimer=setTimeout(pushCloud,500)}
function log(action,details){dbLocal.activity.unshift({id:Date.now()+Math.random(),at:new Date().toISOString(),user:session?.id||'system',role:session?.role||'system',action,details});dbLocal.activity=dbLocal.activity.slice(0,1000);queueSave()}
function login(){const id=document.getElementById('loginId').value.trim();const pass=document.getElementById('loginPass').value;const code=document.getElementById('ownerCode').value;
 if(!id||!pass)return toast('Enter Login ID and password.');
 if(loginMode==='owner'){if(id!==dbLocal.settings.ownerId||pass!==dbLocal.settings.ownerPassword||code!==dbLocal.settings.ownerCode)return toast('Owner login details are incorrect.');session={id,role:'owner',name:'Owner'};startApp();log('LOGIN','Owner logged in');return}
 const u=dbLocal.users.find(x=>x.id===id&&x.password===pass&&x.status==='approved');if(!u)return toast('Employee account not found, not approved, or password is wrong.');session={id:u.id,role:'employee',name:u.name};startApp();log('LOGIN','Employee logged in');}
function lockApp(){if(session)log('LOGOUT','Session locked');session=null;document.getElementById('app').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('loginPass').value='';document.getElementById('ownerCode').value='';}
function startApp(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('roleLine').textContent=(session.role==='owner'?'👑 OWNER':'👨‍💼 EMPLOYEE')+' • '+session.name;renderNav();renderPage()}
function isOwner(){return session?.role==='owner'}
function renderNav(){const items=isOwner()?[['dashboard','🏠 Dashboard'],['customers','👥 Customers'],['milk','🥛 Milk Entry'],['credit','💰 Credit'],['bills','🧾 Bills'],['employees','👨‍💼 Access Management'],['activity','📜 Activity History'],['announcements','📢 Announcements'],['settings','⚙️ Settings']]:[['dashboard','🏠 Dashboard'],['customers','👥 Customers'],['milk','🥛 Milk Entry'],['credit','💰 Credit'],['bills','🧾 Bills'],['announcements','📢 Notices']];document.getElementById('nav').innerHTML=items.map(x=>`<button class="btn ${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(p){page=p;renderNav();renderPage()}
function renderPage(){const c=document.getElementById('content');({dashboard:renderDashboard,customers:renderCustomers,milk:renderMilk,credit:renderCredit,bills:renderBills,employees:renderEmployees,activity:renderActivity,announcements:renderAnnouncements,settings:renderSettings}[page]||renderDashboard)()}
function renderDashboard(){const unpaid=dbLocal.bills.filter(x=>x.balance>0).reduce((a,x)=>a+x.balance,0);const today=dbLocal.milk.filter(x=>x.date===new Date().toISOString().slice(0,10)).length;c.innerHTML=`<div class="grid g4"><div class="card stat">👥 Customers<b>${dbLocal.customers.length}</b></div><div class="card stat">🥛 Milk Entries<b>${dbLocal.milk.length}</b></div><div class="card stat">🧾 Bills<b>${dbLocal.bills.length}</b></div><div class="card stat">💰 Outstanding<b>₹${unpaid.toFixed(2)}</b></div></div><div class="card section"><h2>Welcome, ${esc(session.name)} 👋</h2><p class="muted">${isOwner()?'Owner control center. Manage employees, customers, milk, bills, credits, notices and activity.':'Employee workspace. Changes are saved locally and synced to the dairy cloud when available.'}</p><div class="row" style="margin-top:14px"><button class="btn primary" onclick="go('milk')">🥛 Enter Milk</button><button class="btn" onclick="go('customers')">👥 Customers</button><button class="btn" onclick="go('bills')">🧾 Bills</button></div></div><div class="card section"><h2>Latest Notices</h2>${dbLocal.announcements.slice(0,5).map(a=>`<div class="notice"><b>${esc(a.title)}</b><div class="small muted">${new Date(a.at).toLocaleString()}</div><div style="margin-top:5px">${esc(a.text)}</div></div>`).join('')||'<div class="empty">No notices.</div>'}</div>`}
function renderCustomers(){c.innerHTML=`<div class="card section"><div class="top"><h2>Customer Management</h2><button class="btn primary" onclick="customerForm()">➕ Add Customer</button></div><div class="field"><label>SEARCH BY CUSTOMER CODE OR NAME</label><input id="custSearch" oninput="filterCustomers()" placeholder="Search…"></div><div id="custTable"></div></div>`;filterCustomers()}
function filterCustomers(){const q=(document.getElementById('custSearch')?.value||'').toLowerCase();const a=dbLocal.customers.filter(x=>(x.code+' '+x.name).toLowerCase().includes(q));document.getElementById('custTable').innerHTML=`<div class="tableWrap"><table class="table"><thead><tr><th>Code</th><th>Name</th><th>Pricing</th><th>Price/Fat</th><th>Actions</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${x.type==='fat'?'Fat based':'Fixed price'}</td><td>${x.type==='fat'?'6.0 = ₹'+x.basePrice+'/L':'₹'+x.price+'/L'}</td><td><button class="btn" onclick="customerForm('${esc(x.code)}')">Edit</button> <button class="btn danger" onclick="deleteCustomer('${esc(x.code)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No customers.</td></tr>'}</tbody></table></div>`}
function customerForm(code=''){const x=dbLocal.customers.find(a=>a.code===code)||{code:'',name:'',type:'fixed',price:50,basePrice:50};modal(`<h2>${code?'Edit':'Add'} Customer</h2><div class="field"><label>Customer Code</label><input id="fCode" value="${esc(x.code)}" ${code?'readonly':''}></div><div class="field"><label>Name</label><input id="fName" value="${esc(x.name)}"></div><div class="field"><label>Pricing Type</label><select id="fType" onchange="document.getElementById('fatPrice').classList.toggle('hidden',this.value!=='fat');document.getElementById('fixedPrice').classList.toggle('hidden',this.value!=='fixed')"><option value="fixed" ${x.type==='fixed'?'selected':''}>Fixed Price</option><option value="fat" ${x.type==='fat'?'selected':''}>Fat Based</option></select></div><div id="fixedPrice" class="field ${x.type==='fat'?'hidden':''}"><label>Price per litre</label><input id="fPrice" type="number" step="0.01" value="${x.price||50}"></div><div id="fatPrice" class="field ${x.type!=='fat'?'hidden':''}"><label>Price at 6.0 Fat (₹/L)</label><input id="fBase" type="number" step="0.01" value="${x.basePrice||50}"><div class="small muted">Every 0.1 Fat changes price by ₹0.40/L.</div></div><div class="row"><button class="btn primary" onclick="saveCustomer('${esc(code)}')">Save</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function saveCustomer(oldCode){const code=document.getElementById('fCode').value.trim(),name=document.getElementById('fName').value.trim(),type=document.getElementById('fType').value,price=Number(document.getElementById('fPrice')?.value||50),basePrice=Number(document.getElementById('fBase')?.value||50);if(!code||!name)return toast('Code and name are required.');if(!oldCode&&dbLocal.customers.some(x=>x.code===code))return toast('Customer code already exists.');let x=dbLocal.customers.find(a=>a.code===(oldCode||code));if(!x){x={code,name,type,price,basePrice};dbLocal.customers.push(x)}else Object.assign(x,{name,type,price,basePrice});closeModal();queueSave();log('CUSTOMER_SAVE',code);renderPage();toast('Customer saved.')}
function deleteCustomer(code){if(!confirm('Delete customer '+code+'?'))return;dbLocal.customers=dbLocal.customers.filter(x=>x.code!==code);queueSave();log('CUSTOMER_DELETE',code);renderPage()}
function weekDays(){const now=new Date(),day=now.getDay(),diff=(day+3)%7;const thu=new Date(now);thu.setDate(now.getDate()-diff);return Array.from({length:7},(_,i)=>{const d=new Date(thu);d.setDate(thu.getDate()+i);return d.toISOString().slice(0,10)})}
function calcFatPrice(base,fat){return base+(Number(fat)-6)*4}
function renderMilk(){const days=weekDays();c.innerHTML=`<div class="card section"><div class="top"><h2>🥛 7-Day Milk Record</h2><span class="pill">Thursday → Wednesday</span></div><div class="row" style="margin-bottom:10px"><select id="milkCustomer" style="background:#081727;color:#fff;border:1px solid #28415f;border-radius:10px;padding:10px"><option value="">Select customer</option>${dbLocal.customers.map(x=>`<option value="${esc(x.code)}">${esc(x.code)} • ${esc(x.name)}</option>`).join('')}</select><button class="btn primary" onclick="loadMilkCustomer()">Load Customer</button></div><div id="milkEditor" class="empty">Select a customer and click Load Customer.</div></div>`}
function loadMilkCustomer(){const code=document.getElementById('milkCustomer').value,x=dbLocal.customers.find(a=>a.code===code);if(!x)return toast('Select customer.');const days=weekDays();document.getElementById('milkEditor').innerHTML=`<div class="notice"><b>${esc(x.code)} • ${esc(x.name)}</b> — ${x.type==='fat'?'Fat based':'Fixed price'}</div><div class="daygrid"><div class="head">Session</div>${days.map(d=>`<div class="head">${new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short'})}<br><span class="small">${d}</span></div>`).join('')}<div>🌅 Morning L</div>${days.map(d=>`<div><input id="m_${d}" type="number" min="0" step="0.01" placeholder="L"></div>`).join('')}<div>🌆 Evening L</div>${days.map(d=>`<div><input id="e_${d}" type="number" min="0" step="0.01" placeholder="L"></div>`).join('')}${x.type==='fat'?`<div>Morning Fat</div>${days.map(d=>`<div><input id="mf_${d}" type="number" min="0" step="0.1" placeholder="Fat"></div>`).join('')}<div>Evening Fat</div>${days.map(d=>`<div><input id="ef_${d}" type="number" min="0" step="0.1" placeholder="Fat"></div>`).join('')}`:''}</div><div class="row" style="margin-top:12px"><button class="btn success" onclick="saveMilk('${esc(x.code)}','${x.type}',${x.basePrice||50},${x.price||50})">💾 Save 7-Day Record</button><button class="btn" onclick="go('bills')">Go to Bills</button></div>`}
function saveMilk(code,type,base,price){const days=weekDays();days.forEach(d=>{['m','e'].forEach(s=>{const liters=Number(document.getElementById(s+'_'+d)?.value||0),fat=type==='fat'?Number(document.getElementById((s==='m'?'mf':'ef')+'_'+d)?.value||0):0;if(liters>0){const existing=dbLocal.milk.find(x=>x.customer===code&&x.date===d&&x.session===s);const row={id:existing?.id||Date.now()+Math.random(),customer:code,date:d,session:s,liters,fat,price:type==='fat'?calcFatPrice(base,fat):price};if(existing)Object.assign(existing,row);else dbLocal.milk.push(row)}})});queueSave();log('MILK_SAVE',code+' 7-day record');toast('Milk record saved and synced when cloud is available.')}
function renderCredit(){c.innerHTML=`<div class="card section"><div class="top"><h2>💰 Customer Credit</h2><button class="btn primary" onclick="creditForm()">➕ Add Credit</button></div><div class="tableWrap"><table class="table"><thead><tr><th>Date</th><th>Customer</th><th>Amount</th><th>Reason</th><th>By</th></tr></thead><tbody>${dbLocal.credits.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.customer)}</td><td>₹${Number(x.amount).toFixed(2)}</td><td>${esc(x.reason)}</td><td>${esc(x.by)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No credit records.</td></tr>'}</tbody></table></div></div>`}
function creditForm(){modal(`<h2>Add Customer Credit</h2><div class="field"><label>Customer</label><select id="crCust">${dbLocal.customers.map(x=>`<option value="${esc(x.code)}">${esc(x.code)} • ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Amount</label><input id="crAmt" type="number" step="0.01"></div><div class="field"><label>Reason</label><select id="crReason"><option>Recharge</option><option>Cattle Food</option><option>Baki</option><option>Shop</option><option>Cylinder</option><option>Other</option></select></div><div class="row"><button class="btn primary" onclick="saveCredit()">Save</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function saveCredit(){const amount=Number(document.getElementById('crAmt').value);if(!(amount>0))return toast('Enter a valid amount.');dbLocal.credits.unshift({id:Date.now(),date:new Date().toISOString().slice(0,10),customer:document.getElementById('crCust').value,amount,reason:document.getElementById('crReason').value,by:session.id});closeModal();queueSave();log('CREDIT_ADD','₹'+amount);renderPage()}
function renderBills(){const codes=[...new Set(dbLocal.milk.map(x=>x.customer))];c.innerHTML=`<div class="card section noPrint"><div class="top"><h2>🧾 Bill Center</h2><span class="pill">6 bills per A4</span></div><div class="field"><label>Select up to 6 customers</label><select id="billCust" multiple size="6">${dbLocal.customers.map(x=>`<option value="${esc(x.code)}">${esc(x.code)} • ${esc(x.name)}</option>`).join('')}</select></div><div class="row"><button class="btn primary" onclick="previewBills()">Preview 6 Bills</button><button class="btn success" onclick="printBills()">🖨️ Print</button><button class="btn" onclick="saveBills()">💾 Save Bills</button></div></div><div id="billPreview" class="card section"><div class="empty">Choose customers to preview bills.</div></div>`}
function billData(code){const x=dbLocal.customers.find(a=>a.code===code),rows=dbLocal.milk.filter(a=>a.customer===code),total=rows.reduce((s,r)=>s+r.liters*r.price,0),credit=dbLocal.credits.filter(a=>a.customer===code).reduce((s,r)=>s+r.amount,0);return {x,rows,total,credit,balance:total-credit}}
function billHtml(code){const b=billData(code);return `<div class="bill"><h3>DHANALAKSHMI MILK DAIRY</h3><div style="font-size:12px;margin:4px 0"><b>${esc(b.x.code)}</b> • ${esc(b.x.name)}</div><table><tbody>${b.rows.slice(-14).map(r=>`<tr><td>${new Date(r.date+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short'})} ${r.session==='m'?'M':'E'}</td><td>${r.liters} L</td><td>₹${(r.liters*r.price).toFixed(2)}</td></tr>`).join('')}</tbody></table><div style="margin-top:7px;font-size:12px"><b>Milk Total: ₹${b.total.toFixed(2)}</b><br>Credit: ₹${b.credit.toFixed(2)}<br><b>Balance: ₹${b.balance.toFixed(2)}</b></div></div>`}
function selectedBillCodes(){return [...document.getElementById('billCust').selectedOptions].slice(0,6).map(o=>o.value)}
function previewBills(){const codes=selectedBillCodes();if(!codes.length)return toast('Select customers.');document.getElementById('billPreview').innerHTML='<div class="billSheet">'+codes.map(billHtml).join('')+'</div>'}
function printBills(){previewBills();setTimeout(()=>window.print(),150)}
function saveBills(){const codes=selectedBillCodes();if(!codes.length)return toast('Select customers.');codes.forEach(code=>{const b=billData(code);dbLocal.bills.push({id:Date.now()+Math.random(),date:new Date().toISOString(),customer:code,total:b.total,credit:b.credit,balance:b.balance})});queueSave();log('BILLS_SAVE',codes.join(','));toast('Bills saved.')}
function renderEmployees(){const pending=dbLocal.requests.filter(x=>x.status==='pending');c.innerHTML=`<div class="card section"><div class="top"><h2>👨‍💼 Access Management</h2><button class="btn primary" onclick="employeeForm()">➕ Create Employee</button></div><h3>Pending Requests</h3>${pending.map(r=>`<div class="notice"><b>${esc(r.name)}</b> • ${esc(r.id)}<div class="small muted">${esc(r.reason||'No message')}</div><div class="row" style="margin-top:8px"><button class="btn success" onclick="approveRequest('${esc(r.id)}')">Approve</button><button class="btn danger" onclick="rejectRequest('${esc(r.id)}')">Reject</button></div></div>`).join('')||'<div class="empty">No pending requests.</div>'}</div><div class="card section"><h2>Employee Accounts</h2><div class="tableWrap"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Status</th><th>Actions</th></tr></thead><tbody>${dbLocal.users.map(u=>`<tr><td>${esc(u.id)}</td><td>${esc(u.name)}</td><td>${esc(u.status)}</td><td><button class="btn" onclick="employeeForm('${esc(u.id)}')">Edit</button> <button class="btn danger" onclick="removeEmployee('${esc(u.id)}')">Remove</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No employees.</td></tr>'}</tbody></table></div></div>`}
function employeeForm(id=''){const u=dbLocal.users.find(x=>x.id===id)||{id:'',name:'',password:'',status:'approved'};modal(`<h2>${id?'Edit':'Create'} Employee</h2><div class="field"><label>Login ID</label><input id="uId" value="${esc(u.id)}"></div><div class="field"><label>Name</label><input id="uName" value="${esc(u.name)}"></div><div class="field"><label>Password</label><input id="uPass" value="${esc(u.password)}"></div><div class="field"><label>Status</label><select id="uStatus"><option ${u.status==='approved'?'selected':''}>approved</option><option ${u.status==='disabled'?'selected':''}>disabled</option></select></div><div class="row"><button class="btn primary" onclick="saveEmployee('${esc(id)}')">Save</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function saveEmployee(old){const id=document.getElementById('uId').value.trim(),name=document.getElementById('uName').value.trim(),password=document.getElementById('uPass').value,status=document.getElementById('uStatus').value;if(!id||!name||!password)return toast('All fields are required.');if(!old&&dbLocal.users.some(x=>x.id===id))return toast('Login ID already exists.');let u=dbLocal.users.find(x=>x.id===(old||id));if(!u){u={id,name,password,status};dbLocal.users.push(u)}else Object.assign(u,{id,name,password,status});closeModal();queueSave();log('EMPLOYEE_SAVE',id);renderPage()}
function approveRequest(id){const r=dbLocal.requests.find(x=>x.id===id);if(!r)return;const password=r.requestedPassword||'12345';if(!dbLocal.users.some(x=>x.id===id))dbLocal.users.push({id,name:r.name,password,status:'approved'});r.status='approved';r.approvedAt=new Date().toISOString();queueSave();log('EMPLOYEE_APPROVE',id);renderPage();toast('Employee approved. Password: '+password)}
function rejectRequest(id){const r=dbLocal.requests.find(x=>x.id===id);if(r)r.status='rejected';queueSave();log('EMPLOYEE_REJECT',id);renderPage()}
function removeEmployee(id){if(!confirm('Remove employee '+id+'?'))return;dbLocal.users=dbLocal.users.filter(x=>x.id!==id);queueSave();log('EMPLOYEE_REMOVE',id);renderPage()}
function openRequest(){modal(`<h2>📝 Employee Access Request</h2><div class="field"><label>Requested Login ID</label><input id="rId"></div><div class="field"><label>Your Name</label><input id="rName"></div><div class="field"><label>Password you want</label><input id="rPass" type="password"></div><div class="field"><label>Message</label><textarea id="rMsg" rows="3"></textarea></div><div class="row"><button class="btn primary" onclick="submitRequest()">Send Request</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function submitRequest(){const id=document.getElementById('rId').value.trim(),name=document.getElementById('rName').value.trim(),password=document.getElementById('rPass').value;if(!id||!name||!password)return toast('Fill all required fields.');if(dbLocal.users.some(x=>x.id===id)||dbLocal.requests.some(x=>x.id===id&&x.status==='pending'))return toast('That Login ID is already in use or pending.');dbLocal.requests.unshift({id,name,requestedPassword:password,reason:document.getElementById('rMsg').value,status:'pending',at:new Date().toISOString()});queueSave();closeModal();toast('Request sent to owner.');}
function renderActivity(){c.innerHTML=`<div class="card section"><div class="top"><h2>📜 Activity History</h2><button class="btn danger" onclick="clearActivity()">Clear History</button></div><div class="tableWrap"><table class="table"><thead><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Details</th></tr></thead><tbody>${dbLocal.activity.map(a=>`<tr><td>${new Date(a.at).toLocaleString()}</td><td>${esc(a.user)}</td><td>${esc(a.role)}</td><td>${esc(a.action)}</td><td>${esc(a.details)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No activity.</td></tr>'}</tbody></table></div></div>`}
function clearActivity(){if(!confirm('Clear activity history?'))return;dbLocal.activity=[];queueSave();renderPage()}
function renderAnnouncements(){c.innerHTML=`<div class="card section"><div class="top"><h2>📢 Announcements & Notifications</h2>${isOwner()?'<button class="btn primary" onclick="announcementForm()">➕ New Announcement</button>':''}</div>${dbLocal.announcements.map(a=>`<div class="notice"><div class="row"><b>${esc(a.title)}</b><span class="pill">${new Date(a.at).toLocaleString()}</span>${isOwner()?'<button class="btn danger right" onclick="deleteAnnouncement(\''+esc(a.id)+'\')">Delete</button>':''}</div><div style="margin-top:6px">${esc(a.text)}</div><div class="small muted" style="margin-top:5px">By ${esc(a.by||'Owner')}</div></div>`).join('')||'<div class="empty">No announcements.</div>'}</div>`}
function announcementForm(){modal(`<h2>📢 New Announcement</h2><div class="field"><label>Title</label><input id="aTitle"></div><div class="field"><label>Message</label><textarea id="aText" rows="5"></textarea></div><div class="row"><button class="btn primary" onclick="saveAnnouncement()">Publish</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function saveAnnouncement(){const title=document.getElementById('aTitle').value.trim(),text=document.getElementById('aText').value.trim();if(!title||!text)return toast('Title and message required.');dbLocal.announcements.unshift({id:String(Date.now()),title,text,by:session.id,at:new Date().toISOString()});queueSave();log('ANNOUNCEMENT_CREATE',title);closeModal();renderPage()}
function deleteAnnouncement(id){dbLocal.announcements=dbLocal.announcements.filter(a=>a.id!==id);queueSave();log('ANNOUNCEMENT_DELETE',id);renderPage()}
function renderSettings(){if(!isOwner())return go('dashboard');c.innerHTML=`<div class="card section"><h2>⚙️ Owner Settings</h2><div class="grid g2"><div><div class="field"><label>Owner Login ID</label><input id="sId" value="${esc(dbLocal.settings.ownerId)}"></div><div class="field"><label>Owner Password</label><input id="sPass" value="${esc(dbLocal.settings.ownerPassword)}"></div><div class="field"><label>Owner Security Code</label><input id="sCode" value="${esc(dbLocal.settings.ownerCode)}"></div><button class="btn primary" onclick="saveSettings()">Save Owner Settings</button></div><div><div class="notice"><b>Firebase project</b><br>${esc(firebaseConfig.projectId)}</div><div class="notice"><b>Local backup</b><br>${(new Blob([JSON.stringify(dbLocal)]).size/1024).toFixed(1)} KB</div><button class="btn success" onclick="downloadBackup()">⬇️ Download Backup</button> <button class="btn" onclick="document.getElementById('restoreFile').click()">⬆️ Restore</button><input id="restoreFile" type="file" accept="application/json" class="hidden" onchange="restoreBackup(this)"></div></div></div>`}
function saveSettings(){const id=document.getElementById('sId').value.trim(),pass=document.getElementById('sPass').value,code=document.getElementById('sCode').value;if(!id||!pass||!code)return toast('All owner settings are required.');dbLocal.settings={ownerId:id,ownerPassword:pass,ownerCode:code};queueSave();log('SETTINGS_SAVE','Owner settings updated');toast('Owner settings saved.')}
function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(dbLocal,null,2)],{type:'application/json'}));a.download='dhanalakshmi-dairy-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);dbLocal=Object.assign(clone(DEFAULT),d);saveLocal();pushCloud();log('BACKUP_RESTORE',f.name);renderPage();toast('Backup restored.')}catch(e){toast('Invalid backup file.')}};r.readAsText(f)}
const c=document.getElementById('content');
window.addEventListener('beforeunload',saveLocal);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
window.addEventListener('online',()=>{if(cloudReady)pushCloud()});
setLoginMode('owner');
cloudInit().finally(()=>{document.getElementById('loading').classList.add('hidden')});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
